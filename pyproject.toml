[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "--strict-markers -ra"

[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]
